# Is this repository's pinned copy of vbm-land intact, and is a newer release out? Weekly and on dispatch. Read-only: it changes nothing (LAND_AUTO_UPDATE is unset: it only reports).
# A separate workflow from the gate (LAND_CI_WORKFLOW), so a failure here can never make main "red" and block landing: it is a visible reminder, not a gate.
# The update itself is ours: scripts/land/bin/land-update <tag> (the update-vbm-land skill). The source is public: no secret; the default read-only token only.
# Derived from scripts/land/templates/vbm-land-update.yml (no secret fallbacks, actions pinned by commit sha, as scripts/lint-workflows.py requires).
name: vbm-land-update
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Drift check (the vendored copy is exactly its pin, and the source confirms the pin)
        run: scripts/land/bin/land-check --upstream
      - name: Is a newer release out? (reports only)
        run: |
          git config user.name "vbm-land-update"; git config user.email "vbm-land-update@users.noreply.github.com"
          scripts/land/bin/land-update --auto
