# Tier 1 runs on every push to main (scripts/land-direct runs the same script before it pushes: this is the independent check that defines "main is red"); Tier 2 runs every 6 hours and on dispatch and
# is NOT a gate for the next landing: a failure on main means revert, then fix in a worktree (AGENTS.md).
# Public-repository rules, enforced by scripts/lint-workflows.py (Tier 1): every job runs on a GitHub-hosted runner (never self-hosted), there is no pull_request_target trigger, and no secret is used:
# the token is the read-only default GITHUB_TOKEN. Actions are pinned by commit SHA. This file is in the protected set and has a trust-ledger entry.
name: ci
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'  # Tier 2 (leanchecker, nanoda) every 6 hours on main's tip
  workflow_dispatch:       # a manual dispatch runs Tier 1 and Tier 2
permissions:
  contents: read
jobs:
  tier1:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: ci-tier1-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2   # installs mise and the pinned Lean (mise.toml)
      - name: cache .lake, so the build is incremental (only what changed since the cached tree recompiles)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ hashFiles('VbmLlm/**', 'VbmLlmProofs/**') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
      - run: mise exec -- scripts/tier1.sh
  tier2:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: ci-tier2
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: scripts/land/bin/land-check --upstream   # the vendored lander is what its source says it is; prints when a newer release exists
      - run: mise exec -- scripts/tier2.sh
