# scripts/land.conf: this repository's landing configuration. Data, not code: LAND_KEY=value per line, no expansion, unknown keys are errors. Every key and its default: the README of the pinned lander (vbm-land).
# Read from origin/<base>, so a change cannot loosen the rules it is judged by.
LAND_BASE=main

# Tier 1 (the gate): runs on the rebased combination.
LAND_TEST_CMD=mise exec -- scripts/tier1.sh

# Red main: the Tier 1 job of the latest push run of this workflow (an infrastructure failure is not red).
LAND_CI_WORKFLOW=ci.yml
LAND_TIER1_JOB=tier1
LAND_RED_MODE=push

# A rebase conflict only in generated files (scripts/generated-paths.txt) takes main's file and regenerates it with the gates' own --write (improvements only).
LAND_GENERATED_LIST=scripts/generated-paths.txt
LAND_REGEN_CMD=mise exec -- scripts/regen-baselines.sh

# Size budget: production lines under VbmLlm/ (a `Diff-Budget: <note>` trailer waives it). Commit rules: Conventional Commits.
LAND_PROD_PATHS=VbmLlm
LAND_BUDGET_LINES=150
LAND_CONVENTIONAL=1

# The gate-defining set: a change that touches it never counts as a fix for a red main, and is judged by the hooks.
LAND_PROTECTED=scripts/land.conf scripts/land.d/* scripts/land/* scripts/land-direct

# The structural protected set (vbm-land v0.4.0): a landing that touches a path of this list is refused (exit 12) unless a one-time approval for exactly that set and diff is already on main.
LAND_PROTECTED_LIST=scripts/protected-paths.txt

# The relabel-attack suite runs in scripts/land.d/post-tier1 and may take minutes: every hook step gets the Tier 1 bound.
LAND_STEP_TIMEOUT=1800
