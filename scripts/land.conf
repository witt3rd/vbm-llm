# scripts/land.conf: this repository's landing configuration. Data, not code: LAND_KEY=value per line. Every key: the README of the pinned lander (vbm-land).
# Stripped to the minimum: a commit that passes Tier 1 lands with no approval, no hash, no size refusal. Red main is read from CI.
LAND_BASE=main
LAND_TEST_CMD=mise exec -- scripts/tier1.sh
LAND_CI_WORKFLOW=ci.yml
LAND_TIER1_JOB=tier1
LAND_RED_MODE=push
LAND_CONVENTIONAL=1
# The lander's own files: a change to them never counts as a fix for a red main.
LAND_PROTECTED=scripts/land.conf scripts/land.d/* scripts/land/* scripts/land-direct
LAND_STEP_TIMEOUT=1800
