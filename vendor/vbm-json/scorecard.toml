# Scorecard adapter for vbm-json (the schema is ADAPTER in the scorecard runner; every key is required).
[subject]
name = "vbm-json"
kind = "library"

[source]
# Lean sources of ours: the spec+code library, the proofs, the ABI description, the vector generator. Not scripts/*.lean (the gates name the forbidden words by design).
globs = ["LeanJson.lean", "LeanJson/**/*.lean", "LeanJsonProofs.lean", "LeanJsonProofs/**/*.lean", "abi/**/*.lean", "vectors/Main.lean"]

[trust]
# our trusted C: the ABI shim and the freestanding wasm runtime (the Lean runtime is excluded); the header is an interface, not executed code
c_files = ["abi/*.c", "runtime/**/*.c"]
ledger = "docs/trust-ledger.md"
entry_regex = "^### T[0-9]"

[tests]
# generated from the spec (vbm-json-vectors-1) and the vendored JSONTestSuite: boundary evidence, not tests (DECISIONS 5)
generated = ["vectors/**"]
# no hand-written test lives where the default patterns miss it
extra = []
# self-tests of the gates and process scripts (required by process honesty; counted there, not as tests of the library). test_abi.sh runs the ABI test as a RUNNER and is one of them;
gate_selftests = ["scripts/test_*.sh"]
# the calls that run the library: a test file counts the calls to these with a string or bytes literal in their arguments (its hand-written input cases); a driver that loads the GENERATED vectors has none
entry_points = ["vbm_json_parse", "parse"]
# none: every test file loads its documents from the generated vectors (rows of vbm-json-vectors-1, the 100000-deep documents included) and builds no input of its own; tests/abi_test.c judges crafted export results
# by ENUMERATION over the boundary values of the result layout against a model of the layout contract, not a list of cases (a driver, listed on the card). A scenario file would be one declared here.
scenario_files = []

[proof]
# the proof assistant (Lean 4) appears only here: its unproved escapes (a placeholder proof, an extra axiom, unsafe code, an implementation override), the comment marker that lets a line mention one,
# the closure gate and the axiom gate. The subject is mounted read-only, so every command works in a writable copy (/tmp/w). The toolchain (lake, lean, leanc) is on the sandbox's PATH (sandbox-bwrap.binds).
sorry_pattern = '\b(sorry|admit|axiom|unsafe|implemented_by|csimp)\b'
allow_marker = "tier1-allow"
closure_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && lake build LeanJson LeanJsonProofs >/dev/null 2>&1 && lake env lean --run scripts/ClosureGate.lean'
closure_regex = 'specified share ([0-9.]+)%'
closure_timeout_seconds = 900
axiom_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && lake build LeanJson LeanJsonProofs >/dev/null 2>&1 && lake env lean --run scripts/AxiomGate.lean'
axiom_regex = 'axiom gate: [0-9]+ constants checked, ([0-9]+) offending'
axiom_timeout_seconds = 900

[bare_metal]
# freestanding: the ABI shim compiled with no libc headers and no libc (it includes the Lean runtime header, which includes libc headers: the honest result is a failed build).
# symbols: the hosted build's undefined symbols, minus the Lean runtime's and our own prefixes, so what is left is what the platform's libc must provide.
build_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && leanc -ffreestanding -nostdlib -nostdinc -c abi/vbm_json.c -I include -I "$(lean --print-prefix)/include" -o /tmp/x.o'
symbols_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && lake build LeanJson:static >/dev/null 2>&1 && leanc -isystem /usr/include -c abi/vbm_json.c -I include -o /tmp/x.o && { nm -u /tmp/x.o; nm -u .lake/build/lib/libvbm_x2djson_LeanJson.a; } | sed -n "s/^ *U //p" | grep -vE "^(lean_|l_|lp_|_l|initialize_|vbm_json_)" | sort -u ; echo --end-of-symbols--'
allowed_symbols = []
# the wasm32 build is freestanding by construction (no libc, no WASI, no imports): the subject's own script builds it from the generated C, the shim and runtime/wasm/rt.c and prints its size
wasm_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && lake build LeanJson:static >/dev/null 2>&1 && scripts/build_wasm.sh /tmp/vbm_json.wasm'
wasm_bytes_regex = '([0-9]+) bytes'
timeout_seconds = 900

[mutation]
comment = "//"
# mutants no test can kill, argued (id, reason, expiry) in the subject: only a reasoned, unexpired entry for a SURVIVING mutant is excluded from the score (scorecard/scorecard: equivalents)
equivalent = "mutants-equivalent.txt"
# code mutants (the scorecard's operator swaps, seeded) of the ABI shim, killed by the subject's C test harness running the GENERATED vectors through the ABI. setup builds the library and the vectors once;
# the harness recompiles the mutated shim (exit 99: it does not build, so the mutant is not viable) and runs the vectors (non-zero: killed). The probe binary is built in a private mktemp -d and runs under .land/tool/bin/run-probe (ulimit -c 0 plus the
# dumpable-clear preload, a private TMPDIR): a crashing mutant leaves no core and no crash record, and no fixed /tmp name; a missing or refusing helper fails the unmutated baseline (not measurable), never a false kill.
files = ["abi/vbm_json.c"]
setup_cmd = 'lake build LeanJson:static vbm-json-vectors >/dev/null 2>&1 && lake exe vbm-json-vectors --n 4 --out ./.mutation-vectors >/dev/null 2>&1'
kill_cmd = 'P=.land/tool/bin/run-probe; [ -x "$P" ] || exit 99; d=$(mktemp -d) && trap "rm -rf $d" EXIT; leanc -isystem /usr/include $(test -d /usr/include/$(uname -m)-linux-gnu && echo -isystem /usr/include/$(uname -m)-linux-gnu) -I include -o $d/abi_t tests/abi_test.c abi/vbm_json.c .lake/build/lib/libvbm_x2djson_LeanJson.a >/dev/null 2>&1 || exit 99; "$P" $d/abi_t ./.mutation-vectors/vectors.jsonl >/dev/null 2>&1'
mutants = 50
seed = 1
kill_timeout_seconds = 120
timeout_seconds = 1800

[bench]
# throughput on SIX corpora (named on the card by their sha256, each verified against the pin below before anything is measured): the scorecard corpus (a deterministic ~1 MB document generated here: 4000 records of strings, numbers, nested arrays
# and objects; it is the PRIMARY corpus, the one the floor is judged on, DECISIONS 1), two synthetic ones generated by the subject's own docs/perf/gen_corpus.py (small objects; long strings with escapes and multibyte UTF-8), and three public ones
# (twitter, citm_catalog and canada: fetched once, outside the sandbox, from the simdjson and nativejson-benchmark repositories, and mounted read-only as $VBM_CORPORA; the hash pin refuses any other bytes). The subject runs through its C ABI against the
# peer set of DECISIONS 2. serde_json and python-json are the scalar parsers the floor ("within 2x of the best scalar comparator") is measured against; simdjson is SIMD, reported as a gap, never floored. The other five corpora are REPORTED (one
# `corpusrow` line each, with the percent of the best scalar comparator), never floored and never averaged in.
# simdjson and serde_json are prebuilt OUTSIDE the sandbox (scorecard/comparators/build.sh: network at build time only) into a directory the launcher mounts read-only (sandbox-bwrap.binds: the directory and
# `env VBM_COMPARATORS <dir>`); run.sh verifies each binary's sha256 against the build-time manifest and prints the pinned version and hashes recorded on the card.
comparators = [{ name = "python-json", scalar = true }, { name = "serde_json", scalar = true }, { name = "simdjson", scalar = false }]
timeout_seconds = 1200
cmd = '''cp -a /subject /tmp/w && cd /tmp/w && lake build LeanJson:static >/dev/null 2>&1 &&
mkdir /tmp/c && python3 docs/perf/gen_corpus.py /tmp/c >/dev/null &&
python3 -c 'import json,random; r=random.Random(5); d=[{"id":i,"name":"item-%d"%i,"vals":[r.random()*1e3 for _ in range(6)],"tags":["a","b","c%d"%(i%7)],"nested":{"k":[i,i+1,{"z":None,"t":True}],"s":"x"*(i%20)}} for i in range(4000)]; open("/tmp/c/scorecard-corpus.json","w").write(json.dumps(d))' &&
for f in twitter citm_catalog canada; do cp "${VBM_CORPORA:?the corpus directory is not mounted (sandbox-bwrap.binds)}/$f.json" /tmp/c/ || exit 1; done &&
cat > /tmp/b.c <<'C'
#include <stdio.h>
#include <stdlib.h>
#include <time.h>
#include <stdint.h>
#include "vbm_json.h"
int main(int c, char **v) { (void)c; FILE *f = fopen(v[1], "rb"); fseek(f, 0, SEEK_END); long n = ftell(f); rewind(f); uint8_t *b = malloc(n); if (fread(b, 1, n, f) != (size_t)n) return 2;
  struct timespec a, z; long it = 0; double el; clock_gettime(CLOCK_MONOTONIC, &a);
  do { vbm_json_tape t; if (vbm_json_parse(b, n, NULL, &t) != VBM_JSON_OK) return 3; vbm_json_free(&t); it++; clock_gettime(CLOCK_MONOTONIC, &z); el = (z.tv_sec - a.tv_sec) + (z.tv_nsec - a.tv_nsec) / 1e9; } while (el < 2.0);
  printf("subject %.1f\n", it * (double)n / 1e6 / el); return 0; }
C
leanc -O2 -isystem /usr/include $(test -d /usr/include/$(uname -m)-linux-gnu && echo -isystem /usr/include/$(uname -m)-linux-gnu) -I include -o /tmp/b /tmp/b.c abi/vbm_json.c .lake/build/lib/libvbm_x2djson_LeanJson.a >/dev/null 2>&1 &&
python3 - <<'PY'
import hashlib, json, os, re, subprocess, sys, time
PIN = [("scorecard-corpus", "857fc854d687e2f3881fd7f3a700d58659902a5edb91e156484726f1204f202c"), ("twitter", "30721e496a8d73cfc50658923c34eb2c0fbe15ee6835005e43ee624d8dedf200"),
       ("canada", "f83b3b354030d5dd58740c68ac4fecef64cb730a0d12a90362a7f23077f50d78"), ("citm_catalog", "a73e7a883f6ea8de113dff59702975e60119b4b58d451d518a929f31c92e2059"),
       ("small-objects", "12b0bc9c4c312449ce677f4fd03e6b693ba7f232f5b1332219bddc2b049af2c8"), ("string-heavy", "e42cabee744c0288079e5eb037aefb069f1e3efda8dd15263fbe4081e5e73228")]
rows, prov = [], {}
for name, want in PIN:
    p = "/tmp/c/%s.json" % name; raw = open(p, "rb").read(); got = hashlib.sha256(raw).hexdigest()
    if got != want: sys.exit("bench: corpus %s has sha256 %s, not the pinned %s" % (name, got, want))
    subj = float(subprocess.run(["/tmp/b", p], capture_output=True, text=True, check=True).stdout.split()[1])
    text = raw.decode(); it = 0; t = time.perf_counter()
    while time.perf_counter() - t < 2.0: json.loads(text); it += 1
    comp = {"python-json": it * len(raw) / 1e6 / (time.perf_counter() - t)}
    out = subprocess.run([os.environ["VBM_COMPARATORS"] + "/run.sh", p], capture_output=True, text=True, check=True).stdout
    for n, v in re.findall(r"^comparator (\S+) (\S+)$", out, re.M): comp[n] = float(v)
    for l in re.findall(r"^provenance .*$", out, re.M): prov[l.split()[1]] = l
    rows.append((name, got, len(raw), subj, comp))
name, got, n, subj, comp = rows[0]
print("corpus %s %d" % (got, n)); print("subject %.1f" % subj)
for k, v in sorted(comp.items()): print("comparator %s %.1f" % (k, v))
print("provenance python-json %s %s -" % (sys.version.split()[0], hashlib.sha256(open(sys.executable, "rb").read()).hexdigest()))
for k in sorted(prov): print(prov[k])
for name, got, n, subj, comp in rows:
    print("corpusrow %s %s %d subject=%.1f %s" % (name, got, n, subj, " ".join("%s=%.1f" % kv for kv in sorted(comp.items()))))
PY
'''

[nonvacuity]
# specification mutants: the same operator swaps in the fast parser (which the proofs refine to the reference): a changed clause must break a proof. The harness exits 99 when the mutated library itself
# does not build (not viable), and fails (non-zero) when the proofs library no longer builds: the mutant is killed by a proof.
comment = "--"
files = ["LeanJson/Parse.lean"]
setup_cmd = 'lake build LeanJson LeanJsonProofs >/dev/null 2>&1'
kill_cmd = 'lake build LeanJson >/dev/null 2>&1 || exit 99; lake build LeanJsonProofs >/dev/null 2>&1'
mutants = 20
seed = 1
kill_timeout_seconds = 900
timeout_seconds = 3500

[tier1]
# git config: a fresh clone has no hooksPath, which the subject's own commit-guard self-test requires (its worktree tool sets it)
# The sandbox caps memory at 4 GB and the fast gate starts three Lean gates at once (each 2 to 4 GB: the axiom gate, the closure gate and its self-tests): all three at once are OOM-killed. A `lake` shim serialises the `lake env lean --run`
# gates (one at a time, flock) and TEST_JOBS=1 runs its test scripts one at a time (4 GB peaks were seen with two); the subject's scripts/tier1.sh is run unchanged, and the extra wall seconds are part of the timed result. TIER1_ALL=1: the subject selects the tests a delta can affect, a card times and counts the whole gate, cold.
command = '''cp -a /subject /tmp/w && cd /tmp/w && git config core.hooksPath scripts/githooks &&
R=$(command -v lake) && mkdir /tmp/shim &&
cat > /tmp/shim/lake <<SH
#!/bin/bash
case " \$* " in *" --run "*) exec flock /tmp/lean-heavy.lock $R "\$@";; *) exec $R "\$@";; esac
SH
chmod +x /tmp/shim/lake && PATH=/tmp/shim:$PATH TEST_JOBS=1 TIER1_ALL=1 scripts/tier1.sh'''
timeout_seconds = 1800
# The WARM run (velocity.tier1_seconds_warm): what a landing costs. It runs in the same sandbox right after the cold run, on the build cache that run left in /tmp/w (and the shim in /tmp/shim). The typical change is an edit to
# one proof module (the commonest landing): the change is untimed; the gate is the subject's own fast gate in delta mode (no TIER1_ALL), which, for a proof-module change, builds what changed, runs every always-on gate
# and runs no test script (the subject's tests-map). The gates whose evidence is a test script are therefore the named warm_skips; every other gate must show its self-test evidence in the warm output.
warm_change_cmd = 'cd /tmp/w && printf "\n-- warm-run change: a comment\n" >> LeanJsonProofs/Policy.lean'
warm_command = 'cd /tmp/w && PATH=/tmp/shim:$PATH TEST_JOBS=1 scripts/tier1.sh'
warm_timeout_seconds = 900
warm_skips = ["C ABI test", "wasm32 build test", "freestanding native test", "language bindings test", "protected-set gate", "lander", "commit-on-main guard", "parallel test runner", "delta test selection", "crash-record check", "gate-diff judge", "relabel-attack suite"]
script = "scripts/tier1.sh"
# the gates of the fast gate and the line of its output that only their negative self-test prints (honesty.gates_self_tested): the scripts/test_*.sh ones print `ok scripts/test_NAME.sh` when the script, which holds the
# negative self-tests of a gate, passed
gates = [
  { name = "forbidden-constructs scan", selftest = "forbidden-constructs scan: negative self-tests ok" },
  { name = "Init-only import scan", selftest = "Init-only import scan: negative self-tests ok" },
  { name = "pipefail lint", selftest = "lint-pipefail: ok" },
  { name = "proof-evaluation lint", selftest = "lint-proof-eval: self-test ok" },
  { name = "zero-warning build", selftest = "zero-warning build: negative self-test ok" },
  { name = "axiom gate", selftest = "axiom gate: negative self-test ok" },
  { name = "obligation ledger gate", selftest = "ledger gate: negative self-tests ok" },
  { name = "closure gate", selftest = "closure gate: [0-9]+ negative self-tests ok" },
  { name = "trust ledger", selftest = "trust ledger: .* [0-9]+ negative self-tests ok" },
  { name = "JSONTestSuite check", selftest = "flipped expectations and mutants are caught" },
  { name = "vectors check", selftest = "the check rejects tampered rows" },
  { name = "C ABI test", selftest = "^ok +scripts/test_abi\\.sh" },
  { name = "wasm32 build test", selftest = "^ok +scripts/test_wasm\\.sh" },
  { name = "freestanding native test", selftest = "^ok +scripts/test_native\\.sh" },
  { name = "language bindings test", selftest = "^ok +scripts/test_bindings\\.sh" },
  { name = "protected-set gate", selftest = "^ok +scripts/test_protected_set\\.sh" },
  { name = "lander", selftest = "^ok +scripts/test_land_direct\\.sh" },
  { name = "commit-on-main guard", selftest = "^ok +scripts/test_githook\\.sh" },
  { name = "parallel test runner", selftest = "^ok +scripts/test_run_parallel\\.sh" },
  { name = "delta test selection", selftest = "^ok +scripts/test_select_tests\\.sh" },
  { name = "crash-record check", selftest = "^ok +scripts/test_no_crash_record\\.sh" },
  { name = "gate-diff judge", selftest = "^ok +scripts/test_gate_diff_improving\\.sh" },
  { name = "relabel-attack suite", selftest = "^ok +scripts/test_relabel_attacks\\.sh" },
]
# the subject's relabel-attack suite (scripts/relabel-attacks.sh): every attack on its gates must be refused (last line PASS), and with the gate each attack relies on replaced by a stub that always succeeds every attack must get through
# and the suite must FAIL (--sabotage). The attacks that rebuild Lean modules (--no-lean skips them) run in the subject's second tier and in its lander, not here: a cold Lean build per attack does not fit the sandbox.
attack_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && git config core.hooksPath scripts/githooks && scripts/relabel-attacks.sh --no-lean'
attack_sabotage_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && git config core.hooksPath scripts/githooks && scripts/relabel-attacks.sh --no-lean --sabotage'
attack_timeout_seconds = 1800
# The evidence names of the fast gate's `ran: NAME: N cases` lines (scripts/ran-gates.txt names five; zero-warning and tests print their own): the log's names must equal this set exactly.
ran_names = ["axiom-gate", "closure-gate", "ledger-gate", "trust-ledger", "vectors-check", "zero-warning", "tests"]

[velocity]
window_hours = 168

[floors]
specified_share = 100
